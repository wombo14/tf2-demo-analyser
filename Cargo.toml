[package]
name = "analysis-template"
version = "0.1.0"
edition = "2021"
default-run = "cli"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
bitbuffer = "0.11.1"
getopts = "0.2.23"
itertools = "0.14.0"
lazy_static = "1.5.0"
mimalloc = { version = "0.1", default-features = false }
num_cpus = "1.16"
opener = "0.8.2"
rfd = { version = "0.15.3", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
steamid-ng = "1.0.0"
tf-demo-parser = "0.6.4"
ureq = "2.12.1"
sha2 = { version = "0.10", optional = true }
web-time = "1.1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lzma-rs = "0.3"
snap = "1.1"

eframe = { version = "0.31.1", optional = true }
egui = { version = "0.31.1", optional = true }
rayon = { version = "1.10", optional = true }
unsafe-libopus = { version = "0.2.0", optional = true }

# The built-in 3D demo player
bytemuck = { version = "1", features = ["derive"], optional = true }
glam = { version = "0.30", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"], optional = true }
tf-asset-loader = { version = "0.2.0", optional = true }
vbsp = { version = "0.9.1", optional = true }
vmdl = { version = "0.2.0", optional = true }
vtf = { version = "0.4.1", optional = true }
cpal = { version = "0.15.3", optional = true }
symphonia = { version = "0.5.4", default-features = false, features = ["mp3"], optional = true }

[features]
gui = [ "eframe", "egui", "dep:rfd", "dep:sha2", "player" ]
player = [ "eframe", "egui", "dep:bytemuck", "dep:cpal", "dep:glam", "dep:image", "dep:symphonia", "dep:tf-asset-loader", "dep:unsafe-libopus", "dep:vbsp", "dep:vmdl", "dep:vtf" ]
experimental = [ "dep:unsafe-libopus" ]
parallel = [ "dep:rayon" ]
rcon = [ "gui" ]
tf2bd = []

[[bin]]
name = "gui"
required-features = [ "gui" ]

[[bin]]
name = "player_preview"
required-features = [ "player" ]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[patch.crates-io]
steamid-ng = { path = "vendor/steamid-ng" }
tf-demo-parser = { path = "vendor/tf-demo-parser" }

